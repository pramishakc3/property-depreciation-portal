name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/depreciation_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/depreciation_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE depreciation_test'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE depreciation_e2e'
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and API tests
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t property-depreciation-portal .
