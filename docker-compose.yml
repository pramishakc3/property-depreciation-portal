services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: depreciation
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/depreciation
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789}
      ALLOW_DEMO_SEED: 'true'
      SECURE_COOKIES: 'false'
    ports: ['4000:4000']

volumes:
  pgdata:
